name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Generate missing audio
        run: python3 scripts/generate-audio.py
      - name: Commit new audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then
            echo "No new audio"
          else
            git commit -m "Generate audio [skip ci]"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi
      # Hand the audio straight to the build, so it builds exactly this push's content.
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: public/audio
          retention-days: 1

  build:
    needs: audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: public/audio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Weekly cache key for the dictionary download
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: public/dict
          key: cedict-v3-${{ steps.week.outputs.week }}
      - name: Build dictionary (CC-CEDICT)
        run: (test -s public/dict/cedict.tsv && test -s public/dict/t2s.json) || npm run dict:build
      - name: Validate content
        run: npm run content:validate
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke tests (375px phone + desktop)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
