name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A new song catalogue (committed by the bot, which doesn't trigger pushes) goes live too.
  workflow_run:
    workflows: [build-songs, build-vocabulary]
    types: [completed]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  # Recordings are made by the azure-audio workflow and committed; the build uses what's in the repo.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Weekly cache key for the dictionary download
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: public/dict
          key: cedict-v3-${{ steps.week.outputs.week }}
      - name: Build dictionary (CC-CEDICT)
        run: (test -s public/dict/cedict.tsv && test -s public/dict/t2s.json) || npm run dict:build
      - name: Validate content
        run: npm run content:validate -- --allow-missing-audio
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke tests (375px phone + desktop)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
