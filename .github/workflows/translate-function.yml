# Deploys the translation helper (supabase/functions/translate) to Supabase and
# gives it the Azure Translator key. Runs when the function changes, or by hand
# from the Actions tab (run it once after adding the secrets below).
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, AZURE_TRANSLATOR_KEY (optional:
# AZURE_TRANSLATOR_REGION, default swedencentral). Skips quietly until they exist.
name: translate-function
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [supabase/functions/translate/**, .github/workflows/translate-function.yml]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: ckvtvzsojjpvjwuyryxw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
      AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION || 'swedencentral' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are there
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$AZURE_TRANSLATOR_KEY" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or AZURE_TRANSLATOR_KEY isn't set yet, so nothing was deployed."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == '1'
        with:
          version: latest
      - name: Set the function's secrets
        if: steps.check.outputs.ready == '1'
        run: |
          # The owner is the app's first (and only) account; its id stays out of the repo.
          OWNER_ID=$(curl -fsS "https://$PROJECT_REF.supabase.co/auth/v1/admin/users?per_page=50" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            | python3 -c "import json,sys; u=json.load(sys.stdin)['users']; print(sorted(u, key=lambda x: x['created_at'])[0]['id'] if u else '')")
          if [ -z "$OWNER_ID" ]; then echo "::error::No account found. Sign in to the app once (Settings, Sync), then run this again."; exit 1; fi
          echo "::add-mask::$OWNER_ID"
          supabase secrets set --project-ref "$PROJECT_REF" \
            AZURE_TRANSLATOR_KEY="$AZURE_TRANSLATOR_KEY" \
            AZURE_TRANSLATOR_REGION="$AZURE_TRANSLATOR_REGION" \
            OWNER_ID="$OWNER_ID"
      - name: Deploy
        if: steps.check.outputs.ready == '1'
        run: |
          supabase functions deploy translate --project-ref "$PROJECT_REF" --use-api
          echo "::notice::Translation helper deployed."
