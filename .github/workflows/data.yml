name: build-vocabulary
# Rebuilds content/data (HSK 3.0 words, glosses, example sentences) from open data
# and commits it. Runs when the build script changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-vocab.ts
      - scripts/fetch-vocab-sources.sh
      - src/content/vocab.ts
      - content/generated-sentences.json
permissions:
  contents: write
concurrency:
  group: vocab
  cancel-in-progress: true
jobs:
  vocab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Weekly cache key for the downloads
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .vocab-sources
          key: vocab-sources-v1-${{ steps.week.outputs.week }}
      - name: Download sources (HSK 3.0, CC-CEDICT, Tatoeba)
        run: bash scripts/fetch-vocab-sources.sh .vocab-sources
      - name: Build words.json and sentences.json
        run: >
          npm run vocab:build --
          --hsk30 .vocab-sources/hsk30 --drk .vocab-sources/drk
          --cedict .vocab-sources/cedict.txt.gz --tatoeba .vocab-sources/tatoeba
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/data
          if git diff --cached --quiet; then
            echo "Vocabulary unchanged"
          else
            git commit -m "Rebuild vocabulary from HSK 3.0, CC-CEDICT and Tatoeba"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi
