name: build-songs
# Rebuilds the Music song catalogue (content/data/songs.json) from MusicBrainz and LRCLIB.
# Weekly, or by hand from the Actions tab. No secrets needed. Stores derived data only, no lyrics.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
concurrency:
  group: songs
  cancel-in-progress: false
jobs:
  songs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Weekly cache key for the dictionary download
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: public/dict
          key: cedict-v3-${{ steps.week.outputs.week }}
      - name: Build dictionary (CC-CEDICT)
        run: (test -s public/dict/cedict.tsv && test -s public/dict/t2s.json) || npm run dict:build
      - name: Build the song catalogue
        run: npx tsx scripts/build-songs.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/data/songs.json content/data/SONGS_REPORT.md
          if git diff --cached --quiet; then
            echo "Catalogue unchanged"
          else
            git commit -m "Rebuild the song catalogue (MusicBrainz + LRCLIB)"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi
